<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Coffee Machine{% endblock %}</title>
    <style>
        :root {
            --bg: #17120e;
            --panel: #221b15;
            --border: #382c22;
            --accent: #c17a41;
            --text: #f3ece3;
            --muted: #a8988a;
            --danger: #b3452f;
            --success: #3c5233;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.4;
        }
        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.01em; }
        nav a {
            color: var(--muted);
            text-decoration: none;
            margin-left: 1.25rem;
            font-size: 0.9rem;
        }
        nav a:hover { color: var(--text); }
        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }
        h2 { font-size: 1.3rem; font-weight: 600; margin: 0 0 1.25rem; }
        h3 { font-size: 1rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 2rem 0 0.75rem; }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.1rem 1.25rem;
            margin-bottom: 0.9rem;
        }
        .messages { list-style: none; padding: 0; margin: 0 0 1.5rem; }
        .messages li { padding: 0.6rem 0.9rem; border-radius: 8px; margin-bottom: 0.5rem; background: var(--success); font-size: 0.9rem; }
        .messages li.error { background: var(--danger); }
        label { display: block; margin: 0.9rem 0 0.3rem; color: var(--muted); font-size: 0.85rem; }
        input[type=text], input[type=number], textarea {
            width: 100%;
            padding: 0.5rem 0.6rem;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: #100c09;
            color: var(--text);
            font-size: 0.95rem;
        }
        input:focus, textarea:focus { outline: 1px solid var(--accent); }
        button, .btn {
            display: inline-block;
            background: var(--accent);
            color: #17120e;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 7px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
        }
        button.secondary, .btn.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
        button.danger, .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
        .between { justify-content: space-between; }
        .pump-row { display: grid; grid-template-columns: 2fr 1fr; gap: 0.75rem; padding: 0.9rem 0; border-bottom: 1px solid var(--border); }
        .pump-row:last-child { border-bottom: none; }
        .muted { color: var(--muted); font-size: 0.85rem; }
        ul.ingredients { margin: 0.5rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.9rem; }
        form.inline { display: inline; }
        .empty { color: var(--muted); font-size: 0.9rem; padding: 1rem 0; }
    </style>
</head>
<body>
<header>
    <h1>Coffee Machine</h1>
    <nav>
        <a href="{% url 'pumps:home' %}">Recipes</a>
        <a href="{% url 'pumps:pump_config' %}">Pumps</a>
    </nav>
</header>
<main>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
